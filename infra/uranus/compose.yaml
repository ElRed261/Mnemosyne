name: mnemosyne-staging

services:
  objectstore:
    image: ${MNEMOSYNE_OBJECTSTORE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    profiles: ["datalake"]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MNEMOSYNE_S3_USER:?Define MNEMOSYNE_S3_USER in .env}
      MINIO_ROOT_PASSWORD: ${MNEMOSYNE_S3_PASSWORD:?Define MNEMOSYNE_S3_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MNEMOSYNE_S3_PORT:-9100}:9000"
      - "127.0.0.1:${MNEMOSYNE_S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - mnemosyne_object_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  mnemosyne_object_data:
    name: mnemosyne_object_data
